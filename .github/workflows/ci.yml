# GoKeep 持续集成：前端检查与构建、后端静态检查与测试。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    name: Web（typecheck / lint / build / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gokeep/web typecheck
      - run: pnpm --filter @gokeep/web lint
      - run: pnpm --filter @gokeep/web test:run
      - run: pnpm --filter @gokeep/web build

  server:
    name: Server（go vet / go test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: server/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test ./...
