name: Build and publish image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: gokeep-image-${{ github.ref }}
  cancel-in-progress: true

env:
  GOKEEP_VERSION: 0.1.${{ github.run_number }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GOKEEP_VERSION=${{ env.GOKEEP_VERSION }}
            GOKEEP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/bringbasket/gokeep:latest
            ghcr.io/bringbasket/gokeep:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Bringbasket/hme-tools
            org.opencontainers.image.version=${{ env.GOKEEP_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
